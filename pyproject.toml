[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riffpi"
dynamic = ["version"]
description = "Control daemon for Kleag's MFX guitar multi-effect pedal (Raspberry Pi + Guitarix)"
readme = "README.md"
license = "CERN-OHL-W-2.0"
requires-python = ">=3.11"
dependencies = [
    # Raspberry Pi I2C/GPIO access (board, busio, digitalio)
    "Adafruit-Blinka>=8.66.2",
    # 3.0.0 dropped the module-level P0-P3 pin constants this code uses (moved to a Pin class) -
    # cap below that until the call sites are ported to the new API.
    "adafruit-circuitpython-ads1x15>=2.4.2,<3.0.0",
    "adafruit-circuitpython-mcp230xx>=2.5.18",
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0",  # Blinka's GPIO backend on the Pi 5 (bcm2712)

    # MIDI I/O to Guitarix
    "mido>=1.2.10",
    "python-rtmidi>=1.4.7",  # mido's virtual-port backend

    # Virtual mouse (joystick/keypad emulate mouse input)
    "python-uinput>=0.11.2",

    # Console/status output
    "rich>=13.3.1",
]

[project.scripts]
riffpi = "riffpi.cli:main"

[project.urls]
Homepage = "https://github.com/kleag/riffpi"
Repository = "https://github.com/kleag/riffpi"
Documentation = "https://kleag.github.io/riffpi/"

[project.optional-dependencies]
dev = ["ruff", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/riffpi"]

[tool.hatch.version]
path = "src/riffpi/__init__.py"

[tool.ruff]
target-version = "py311"
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.bumpver]
current_version = "0.2.6"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"src/riffpi/__init__.py" = [
    '__version__ = "{version}"',
]
