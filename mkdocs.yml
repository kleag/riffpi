site_name: RiffPi Documentation
site_url: https://kleag.github.io/riffpi/
repo_url: https://github.com/kleag/riffpi
edit_uri: edit/main/docs/

theme:
  name: material # Le thème le plus populaire (pro et moderne)
  logo: images/riffpi-mark.svg
  favicon: images/favicon.png
  palette:
    primary: black
    accent: red
  font:
    text: Space Grotesk
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Accueil: index.md
  - Installation: installation.md
  - Guide d'utilisation: usage.md
  - Architecture Audio: architecture.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences # Nécessaire pour les diagrammes Mermaid
  - tables
